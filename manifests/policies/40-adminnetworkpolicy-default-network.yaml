# Mandatory cluster-admin policy on the dedicated default-network policy plane.
#
# Stage 4 demonstrates all three useful ANP actions and precedence over BANP:
#   admin-corporate -> admin-app-target:8443  Allow
#       authoritative ANP Allow; overrides lower BANP Deny
#   admin-rogue -> admin-app-target:8443      Deny
#       authoritative central Deny
#   admin-jenkins -> admin-app-target:8443    Pass
#       delegates to lower tiers; BANP Deny then blocks it
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: nsx-demo-admin-guardrail
  labels:
    demo.openshift.io/owner: nsx-policy-demo
spec:
  priority: 20
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          demo.openshift.io/policy-plane: admin
          demo.openshift.io/admin-role: app
      podSelector:
        matchLabels:
          demo.openshift.io/policy-target: admin-app
  ingress:
    - name: allow-corporate
      action: Allow
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                demo.openshift.io/policy-plane: admin
                demo.openshift.io/admin-role: corporate
            podSelector:
              matchLabels:
                demo.openshift.io/security-group: corporate
      ports:
        - portNumber:
            protocol: TCP
            port: 8443

    - name: deny-rogue
      action: Deny
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                demo.openshift.io/policy-plane: admin
                demo.openshift.io/admin-role: rogue
            podSelector:
              matchLabels:
                demo.openshift.io/security-group: rogue
      ports:
        - portNumber:
            protocol: TCP
            port: 8443

    - name: pass-jenkins
      action: Pass
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                demo.openshift.io/policy-plane: admin
                demo.openshift.io/admin-role: ops
            podSelector:
              matchLabels:
                demo.openshift.io/security-group: jenkins
      ports:
        - portNumber:
            protocol: TCP
            port: 8443
