# Application-owned microsegmentation for the REAL Windows Server 2022 APP VM
# on the Primary Layer2 CUDN.
#
# The VM's virt-launcher pod carries these labels. Once this policy is applied,
# APP-group workloads may reach TCP/8443, while Corporate is isolated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-ingress
  namespace: nsx-demo-app
  labels:
    demo.openshift.io/owner: nsx-policy-demo
spec:
  podSelector:
    matchLabels:
      demo.openshift.io/component: vm
      demo.openshift.io/service: app-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              demo.openshift.io/role: app
          podSelector:
            matchLabels:
              demo.openshift.io/security-group: app
      ports:
        - protocol: TCP
          port: 8443
