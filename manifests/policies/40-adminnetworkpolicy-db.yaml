# Central security policy: the closest OpenShift equivalent to mandatory NSX-T DFW rules.
# The subject is the virt-launcher pod for the Windows 2022 DB VM.
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: nsx-demo-db-security
  labels:
    demo.openshift.io/owner: nsx-policy-demo
spec:
  priority: 20
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          demo.openshift.io/role: db
      podSelector:
        matchLabels:
          demo.openshift.io/security-group: db
  ingress:
    - name: deny-rogue-to-db
      action: Deny
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                demo.openshift.io/role: rogue
            podSelector:
              matchLabels:
                demo.openshift.io/security-group: rogue

    - name: allow-app-to-db-sql-msdtc
      action: Allow
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                demo.openshift.io/network: nsx-demo
            podSelector:
              matchLabels:
                demo.openshift.io/security-group: app
      ports:
        - portNumber: {protocol: TCP, port: 1435}
        - portNumber: {protocol: TCP, port: 61435}
        - portNumber: {protocol: TCP, port: 135}
        - portRange: {protocol: TCP, start: 10000, end: 11000}
        - portRange: {protocol: TCP, start: 49152, end: 65535}

    - name: pass-jenkins-to-db
      action: Pass
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                demo.openshift.io/role: ops
            podSelector:
              matchLabels:
                demo.openshift.io/security-group: jenkins
      ports:
        - portNumber: {protocol: TCP, port: 1435}
        - portNumber: {protocol: TCP, port: 61435}
