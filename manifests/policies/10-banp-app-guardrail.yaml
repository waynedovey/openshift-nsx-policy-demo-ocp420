# Lowest-tier guardrail. Namespace NetworkPolicy is allowed to override it.
# The subject is the virt-launcher pod for the Windows 2022 APP VM.
apiVersion: policy.networking.k8s.io/v1alpha1
kind: BaselineAdminNetworkPolicy
metadata:
  name: default
  labels:
    demo.openshift.io/owner: nsx-policy-demo
spec:
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          demo.openshift.io/role: app
      podSelector:
        matchLabels:
          demo.openshift.io/service: app-web
  ingress:
    - name: baseline-deny-corporate-to-app
      action: Deny
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                demo.openshift.io/role: corporate
            podSelector:
              matchLabels:
                demo.openshift.io/security-group: corporate
      ports:
        - portNumber:
            protocol: TCP
            port: 8443
